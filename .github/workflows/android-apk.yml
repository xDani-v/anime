name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm test
      - run: npx cap add android
      - name: Iconos del launcher (desde assets/)
        run: npx capacitor-assets generate --android
      - run: npx cap sync android

      - name: Configurar Android TV Leanback en AndroidManifest.xml
        run: node scripts/configure-tv-manifest.mjs

      - name: Compilar APK de depuración
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: animeav1-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Compilar APK de release (sin firmar)
        if: env.KEYSTORE_B64 != ''
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Firmar APK de release
        if: env.KEYSTORE_B64 != ''
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.0'

      - name: Publicar APK firmado
        if: env.KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: animeav1-apk-firmado
          path: ${{ steps.sign.outputs.signedReleaseFile }}
